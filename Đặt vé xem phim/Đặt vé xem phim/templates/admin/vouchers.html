{% extends 'base.html' %}{% block title %}Quản lý voucher{% endblock %}{% block content %}<main class="admin-page"><div class="admin-nav"><a href="/admin/">Tổng quan</a><a href="/admin/movies">Phim</a><a href="/admin/showtimes">Suất chiếu</a><a class="active" href="/admin/vouchers">Voucher</a><a href="/admin/rooms">Phòng & Giá</a><a href="/admin/combos">Combo</a><a href="/admin/tickets">Vé</a><a href="/admin/users">Người dùng</a></div><section class="admin-card"><h2>Tạo voucher</h2><form class="admin-form" method="post"><input name="code" placeholder="Mã, ví dụ BETA10" required><select name="type"><option value="percent">Phần trăm</option><option value="fixed">Số tiền</option></select><input name="value" type="number" placeholder="Giá trị" required><input name="label" placeholder="Nhãn hiển thị" required><button class="btn btn-primary">Lưu voucher</button></form></section><section class="admin-card"><h2>Danh sách voucher</h2><div class="admin-table">{% for v in vouchers %}<div class="tr"><span><b>{{v.code}}</b></span><span>{{v.label}}</span><span>{{'Đang bật' if v.active else 'Đang tắt'}}</span><span><form method="post" action="/admin/vouchers/toggle/{{v.code}}"><button class="btn btn-secondary">Bật / tắt</button></form><form method="post" action="/admin/vouchers/delete/{{v.code}}" style="display:inline"><button class="btn btn-danger" onclick="return confirm('Xóa voucher này?')">Xóa</button></form></span></div>{% endfor %}</div></section></main>{% endblock %}
