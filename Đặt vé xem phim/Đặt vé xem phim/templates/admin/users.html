{% extends 'base.html' %}{% block title %}Quản lý người dùng{% endblock %}{% block content %}<main class="admin-page"><div class="admin-nav"><a href="/admin/">Tổng quan</a><a href="/admin/movies">Phim</a><a href="/admin/showtimes">Suất chiếu</a><a href="/admin/vouchers">Voucher</a><a href="/admin/rooms">Phòng & Giá</a><a href="/admin/combos">Combo</a><a href="/admin/tickets">Vé</a><a class="active" href="/admin/users">Người dùng</a></div><section class="admin-card"><h2>Tài khoản thành viên</h2><div class="admin-table">{% for u in users %}<div class="tr"><span>#{{u.id}}</span><span><b>{{u.name}}</b><small>{{u.email}}</small></span><span>{{u.points}} điểm</span><span><form method="post" action="/admin/users/{{u.id}}/role"><select name="role" onchange="this.form.submit()"><option value="user" {% if u.role=='user' %}selected{% endif %}>User</option><option value="admin" {% if u.role=='admin' %}selected{% endif %}>Admin</option></select></form></span></div>{% endfor %}</div></section></main>{% endblock %}
