{% extends 'base.html' %}{% block title %}Quản lý phim{% endblock %}{% block content %}<main class="admin-page"><div class="admin-nav"><a href="/admin/">Tổng quan</a><a class="active" href="/admin/movies">Phim</a><a href="/admin/showtimes">Suất chiếu</a><a href="/admin/vouchers">Voucher</a><a href="/admin/rooms">Phòng & Giá</a><a href="/admin/combos">Combo</a><a href="/admin/tickets">Vé</a><a href="/admin/users">Người dùng</a></div><section class="admin-card"><h2>Thêm phim</h2><form class="admin-form" method="post"><input name="title" placeholder="Tên phim" required><input name="genre" placeholder="Thể loại" required><input name="duration" type="number" placeholder="Thời lượng (phút)" required><input name="poster" placeholder="URL poster"><input name="trailer" placeholder="URL trailer YouTube"><select name="status"><option>Đang chiếu</option><option>Sắp chiếu</option><option>Suất chiếu đặc biệt</option><option>Ngừng chiếu</option></select><textarea name="description" placeholder="Giới thiệu phim"></textarea><button class="btn btn-primary">Thêm phim</button></form></section><section class="admin-card"><h2>Danh sách phim</h2><div class="admin-table">{% for m in movies %}<div class="tr"><span>#{{m.id}}</span><span><b>{{m.title}}</b><small>{{m.genre}} · {{m.duration}} phút</small></span><span>{{m.status}}</span><span><form method="post" action="/admin/movies/delete/{{m.id}}"><button class="btn btn-danger" onclick="return confirm('Xóa phim này?')">Xóa</button></form></span></div>{% endfor %}</div></section></main>{% endblock %}
